[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edaglite"
version = "0.5.0"
authors = [
  { name = "Wuyang Yuan", email = "yuanwuyang@foxmail.com" }
]
description = "A lightweight, embeddable DAG workflow manager with caching and a visual editor"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.8"
keywords = ["dag", "workflow", "pipeline", "embedded", "caching", "data-processing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "eel>=0.16.0",
    "bottle>=0.12.25",
    "gevent>=23.9.1",
    "greenlet>=2.0.2",
    "colorama>=0.4.6",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/WuyangYuan/edaglite"
Repository = "https://github.com/WuyangYuan/edaglite"
Issues = "https://github.com/WuyangYuan/edaglite/issues"
Changelog = "https://github.com/WuyangYuan/edaglite/releases"

[project.scripts]
edaglite-run = "edaglite.run:main"
edaglite-viewer = "edaglite.pipeline_viewer:main"
edaglite-clean = "edaglite.clean:main"

[tool.setuptools]
packages = ["edaglite"]
package-data = { "edaglite" = ["web/*.html", "web/**/*.js"] }
include-package-data = true
