[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edaglite"
version = "0.4.0"
authors = [
  { name="Your Name", email="your.email@example.com" }
]
description = "A lightweight, embeddable DAG workflow manager with caching and a visual editor"
license = "MIT"
requires-python = ">=3.8"
keywords = ["dag", "workflow", "pipeline", "embedded", "caching", "data-processing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "eel>=0.16.0",
    "bottle>=0.12.25",
    "gevent>=23.9.1",
    "greenlet>=2.0.2",
    "colorama>=0.4.6",
    "typing-extensions>=4.8.0",
]

[project.scripts]
edaglite-run = "edaglite.run:main"
edaglite-viewer = "edaglite.pipeline_viewer:main"
edaglite-clean = "edaglite.clean:main"

[tool.setuptools]
packages = ["edaglite"]
package-data = { "edaglite" = ["web/*.html", "web/**/*.js"] }
include-package-data = true
